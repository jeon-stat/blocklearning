# PyPI 배포: GitHub에서 Release를 게시(publish)하면 패키지를 만들어 PyPI에 올린다.
# 비밀번호·토큰 없이 PyPI의 Trusted Publishing(이 저장소·이 파일·환경 pypi를 PyPI에 미리 등록)으로 올림.
name: publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 버전 확인 (Release 태그 vX.Y.Z = pyproject version)
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "태그 ${GITHUB_REF_NAME} 와 pyproject 버전 $v 이 다름"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
