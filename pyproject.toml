[project]
name = "dlstudio"
version = "0.1.0"
description = "DL studio: 딥러닝을 직접 짜기 어려운 사람이 블록을 이어 모델을 만들고 학습해 쓰는 로컬 웹 도구"
readme = "README.md"
requires-python = ">=3.10"
# torch는 PC에 이미 있는 것을 써도 됨 (없으면 pip가 설치)
dependencies = ["numpy>=1.24", "torch>=2.0"]

[project.optional-dependencies]
# 이미지 폴더 불러오기 (png·jpg·bmp)
image = ["pillow>=9"]

[project.scripts]
dlstudio = "dlstudio.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dlstudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
